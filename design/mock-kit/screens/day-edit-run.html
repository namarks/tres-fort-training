<!-- Edit (from Details): this day only by default. -->
<style>.unit { display:inline-flex; align-items:center; gap:3px; color:var(--accent); font-size:18px; font-weight:600; }</style>
{{status}}
<div class="sheet-back"></div>
<div class="sheet">
  <div class="grabber"></div>
  <div class="nav-inline"><span class="cancel">Cancel</span><span class="title">Edit Friday's run</span><span></span></div>
  <div class="list-header" style="padding-top:14px">Kind of run</div>
  <div class="pills" style="margin:0 16px"><span class="pill" style="background:var(--surface2);min-height:36px;font-size:15px">Easy</span><span class="pill on" style="min-height:36px;font-size:15px">Tempo</span><span class="pill" style="background:var(--surface2);min-height:36px;font-size:15px">Intervals</span><span class="pill" style="background:var(--surface2);min-height:36px;font-size:15px">Long</span></div>
  <div class="list-header">How long</div>
  <div class="card r14" style="margin:0 16px;padding:16px">
    <div class="row" style="justify-content:space-between"><span class="stepper">−</span><div class="big-value"><span class="display" style="font-size:48px">50</span><span class="unit">min<i data-icon="chevron.up.chevron.down" data-size="12" data-weight="2.4"></i></span></div><span class="stepper">+</span></div>
  </div>
  <div class="list-footer" style="padding-top:10px">10 min warm-up · 30 min at 155–161 bpm · 10 min cool-down.</div>
  <div class="list-footer" style="color:var(--accent);font-weight:600;font-size:15px;padding-top:10px">Edit steps</div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 20px 30px;background:var(--bg)"><div class="btn-primary">Save for Friday</div><div class="caption" style="text-align:center;margin-top:10px;color:var(--accent);font-weight:600;font-size:14px">Change every Friday instead</div></div>
</div>
