<!-- Details: the whole run, with Edit. -->
{{status}}
<div class="sheet-back"></div>
<div class="sheet">
  <div class="grabber"></div>
  <div class="nav-inline"><span class="cancel">Done</span><span class="title">Tempo run</span><span class="done">Edit</span></div>
  <div class="list-header" style="padding-top:8px">Friday, Nov 13</div>
  <div class="card r14" style="margin:0 16px">
    <div class="stats" style="grid-template-columns:1fr 1fr 1fr">
      <div class="stat"><div class="k">Total</div><div class="v">40 min</div></div>
      <div class="stat"><div class="k">Effort</div><div class="v">Tempo</div></div>
      <div class="stat"><div class="k">Steps</div><div class="v">3</div></div>
    </div>
  </div>
  <div class="list-header">Steps</div>
  <div class="list">
    <div class="item center"><span class="kind sm" style="font:700 12px JetBrainsMono,monospace">1</span><div><div class="t">Warm up · 10 min</div><div class="d">Easy</div></div></div>
    <div class="item center"><span class="kind sm" style="font:700 12px JetBrainsMono,monospace">2</span><div><div class="t">Run · 20 min</div><div class="d">Heart rate 155–161 bpm</div></div></div>
    <div class="item center"><span class="kind sm" style="font:700 12px JetBrainsMono,monospace">3</span><div><div class="t">Cool down · 10 min</div><div class="d">Easy</div></div></div>
  </div>
  <div class="list-footer">The recorder calls out each step and its target as you run.</div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 20px 30px;background:var(--bg)"><div class="btn-primary">Start run</div></div>
</div>
