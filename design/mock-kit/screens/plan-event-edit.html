<!-- The goal event editor, opened from its card (EventGoalEditor). -->
{{status}}
<div class="sheet-back"></div>
<div class="sheet">
  <div class="grabber"></div>
  <div class="nav-inline"><span class="cancel">Cancel</span><span class="title">Event</span><span class="done">Save</span></div>
  <div class="list" style="margin-top:14px">
    <div class="switch-row"><span>Turkey Trot 5k</span></div>
    <div class="switch-row" style="border-top:.5px solid color-mix(in srgb, var(--text) 14%, transparent)"><span>Date</span><span class="time-pill">Nov 26, 2026</span></div>
  </div>
  <div class="list" style="margin-top:22px">
    <div class="switch-row"><span>Type</span><span class="accent row" style="gap:4px">Running<i data-icon="chevron.up.chevron.down" data-size="12" data-weight="2.4"></i></span></div>
    <div class="switch-row" style="border-top:.5px solid color-mix(in srgb, var(--text) 14%, transparent)"><span>Distance</span><span class="accent row" style="gap:4px">5k<i data-icon="chevron.up.chevron.down" data-size="12" data-weight="2.4"></i></span></div>
  </div>
  <div class="list" style="margin-top:22px">
    <div class="switch-row"><span>Goal time</span><span class="muted">20:00</span></div>
  </div>
  <div class="list-footer">Optional, like 20:00 or 1:45:30. Goal pace 6:26/mi.</div>
  <div class="list" style="margin-top:28px"><div class="switch-row" style="justify-content:center;color:var(--danger)">Remove event</div></div>
  <div class="list-footer">Your coach and the web read the same event. Changing or removing it leaves your weeks and history as they are.</div>
</div>
