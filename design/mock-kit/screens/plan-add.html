<!-- "Add to your week", opened from the Plan tab (PlanComposerView, app-design-pass P24). -->
{{status}}
<div class="sheet-back"></div>
<div class="sheet" style="top:58px">
  <div class="grabber"></div>
  <div class="nav-inline"><span class="cancel">Cancel</span><span class="title">Add to your week</span><span></span></div>
  <div class="tiles compact" style="margin:6px 16px 0"><div class="on"><i data-icon="figure.run" data-size="20"></i>Run</div><div><i data-icon="bicycle" data-size="20"></i>Ride</div><div><i data-icon="figure.pool.swim" data-size="20"></i>Swim</div><div><i data-icon="dumbbell" data-size="20"></i>Lift</div></div>
  <div class="tiles compact" style="margin:8px 16px 0"><div><i data-icon="figure.core.training" data-size="20"></i>At home</div><div><i data-icon="sportscourt" data-size="20"></i>Other</div><div><i data-icon="square.stack" data-size="20"></i>Saved</div></div>
  <div class="list-header">How far</div>
  <div class="card r14" style="margin:0 16px;padding:12px 16px">
    <div class="segmented" style="margin:0 0 12px"><span class="on">Distance</span><span>Time</span><span>Steps</span></div>
    <div class="row" style="justify-content:space-between">
      <span class="stepper">−</span>
      <div class="big-value"><span class="display" style="font-size:44px">3</span><span class="u">mi</span></div>
      <span class="stepper">+</span>
    </div>
    <div class="pills" style="justify-content:center;margin-top:10px"><span class="pill" style="background:var(--surface2);min-height:34px;font-size:14px">2</span><span class="pill on" style="min-height:34px;font-size:14px">3</span><span class="pill" style="background:var(--surface2);min-height:34px;font-size:14px">4</span><span class="pill" style="background:var(--surface2);min-height:34px;font-size:14px">5</span><span class="pill" style="background:var(--surface2);min-height:34px;font-size:14px">6</span><span class="pill" style="background:var(--surface2);min-height:34px;font-size:14px">10</span></div>
  </div>
  <div class="list-header">Name</div>
  <div class="field" style="margin:0 16px"><span class="ph">3 mi run</span></div>
  <div class="list-header">Which days</div>
  <div class="days" style="margin:0 16px"><span class="taken">M</span><span class="taken">T</span><span class="on">W</span><span class="taken">T</span><span>F</span><span class="taken">S</span><span class="taken">S</span></div>
  <div class="list-header">Time · optional</div>
  <div class="list"><div class="switch-row"><span>Remind me at a set time</span><span class="switch"></span></div></div>
  <div class="list-footer">Add a time to get a reminder. You can also set one later from the day.</div>
</div>
