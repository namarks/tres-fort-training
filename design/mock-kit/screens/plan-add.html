<!-- "Add to your week", opened from the Plan tab (PlanComposerView, app-design-pass P27): one row of tiles, When first, the name last. -->
{{status}}
<div class="sheet-back"></div>
<div class="sheet" style="top:58px">
  <div class="grabber"></div>
  <div class="nav-inline"><span class="cancel">Cancel</span><span class="title">Add to your week</span><span></span></div>
  <div class="tiles compact" style="margin:6px 0 0 16px;overflow:hidden;flex-wrap:nowrap"><div class="on" style="flex:none;width:84px"><i data-icon="figure.run" data-size="20"></i>Run</div><div style="flex:none;width:84px"><i data-icon="bicycle" data-size="20"></i>Ride</div><div style="flex:none;width:84px"><i data-icon="figure.pool.swim" data-size="20"></i>Swim</div><div style="flex:none;width:84px"><i data-icon="dumbbell" data-size="20"></i>Lift</div><div style="flex:none;width:84px"><i data-icon="figure.core.training" data-size="20"></i>At home</div><div style="flex:none;width:84px"><i data-icon="sportscourt" data-size="20"></i>Other</div><div style="flex:none;width:84px"><i data-icon="square.stack" data-size="20"></i>Saved</div></div>
  <div class="list-header">When</div>
  <div class="days" style="margin:0 16px"><span>M</span><span>T</span><span class="on">W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
  <div class="list" style="margin-top:8px"><div class="switch-row"><span>At a set time</span><span class="switch"></span></div></div>
  <div class="list-footer">Repeats every week.</div>
  <div class="list-header">How far</div>
  <div class="card r14" style="margin:0 16px;padding:12px 16px">
    <div class="segmented" style="margin:0 0 12px"><span class="on">Distance</span><span>Time</span><span>Steps</span></div>
    <div class="row" style="justify-content:space-between">
      <span class="stepper">−</span>
      <div class="big-value"><span class="display" style="font-size:44px">3</span><span class="u">mi</span></div>
      <span class="stepper">+</span>
    </div>
    <div class="pills" style="justify-content:center;margin-top:10px"><span class="pill" style="background:var(--surface2);min-height:34px;font-size:14px">2</span><span class="pill on" style="min-height:34px;font-size:14px">3</span><span class="pill" style="background:var(--surface2);min-height:34px;font-size:14px">4</span><span class="pill" style="background:var(--surface2);min-height:34px;font-size:14px">5</span><span class="pill" style="background:var(--surface2);min-height:34px;font-size:14px">6</span><span class="pill" style="background:var(--surface2);min-height:34px;font-size:14px">10</span></div>
  </div>
  <div class="list-header">Name · optional</div>
  <div class="field" style="margin:0 16px"><span class="ph">3 mi run</span></div>
  <div class="list-footer">Saved to your workouts, so you can add it again from Saved or rename it later.</div>
</div>
