<!-- Today with a planned run: a summary, Start, and Details, Swap, Skip
     (TodayView.plannedWorkout, PlannedRunGlance, DayActionsRow). -->
{{status}}
<div class="nav-inline"><span></span><span class="title">Today</span><span style="justify-self:end" class="glass-btn"><i data-icon="plus" data-size="22" data-weight="2"></i></span></div>
<div class="scroll stack-22" style="padding-top:26px">
  <div class="mono caption muted" style="font-size:12px">Friday, November 13</div>
  <div class="hero stack-16">
    <div class="mono caption muted" style="font-size:12px">Planned run</div>
    <div class="display" style="font-size:30px">Tempo run</div>
    <div class="row" style="gap:18px">
      <div><div class="label" style="color:var(--muted)">Time</div><div class="headline">40 min</div></div>
      <div><div class="label" style="color:var(--muted)">Effort</div><div class="headline">Tempo</div></div>
      <div><div class="label" style="color:var(--muted)">Target</div><div class="headline">HR 155–161</div></div>
    </div>
    <div class="btn-primary">Start run</div>
    <div class="row" style="gap:8px;margin-top:4px">
      <span class="pill" style="flex:1;justify-content:center;background:color-mix(in srgb, var(--text) 10%, transparent)"><i data-icon="list.bullet.clipboard" data-size="15"></i>Details</span>
      <span class="pill" style="flex:1;justify-content:center;background:color-mix(in srgb, var(--text) 10%, transparent)"><i data-icon="repeat" data-size="15"></i>Swap</span>
      <span class="pill" style="flex:1;justify-content:center;background:color-mix(in srgb, var(--text) 10%, transparent)"><i data-icon="moon.zzz" data-size="15"></i>Skip</span>
    </div>
  </div>
</div>
{{tabbar:today}}
