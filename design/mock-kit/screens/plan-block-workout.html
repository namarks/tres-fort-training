<!-- All options: one of the block's workouts, opened from the block (BlockWorkoutSheet). -->
{{status}}
<div class="sheet-back"></div>
<div class="sheet">
  <div class="grabber"></div>
  <div class="nav-inline"><span></span><span class="title">Long run</span><span class="done">Done</span></div>
  <div class="list-header" style="padding-top:6px">DAYS IN EVERY WEEK OF THE BLOCK</div>
  <div class="chiprow" style="padding:6px 16px"><span class="c">M</span><span class="c">T</span><span class="c">W</span><span class="c">T</span><span class="c">F</span><span class="c">S</span><span class="c on">S</span></div>
  <div class="list-footer">To change one week only, tap that day in the block.</div>
  <div class="list" style="margin-top:14px">
    <div class="item center"><span class="t">Week targets</span><span class="muted mono" style="margin-left:auto;font-size:13px">5 → 9 mi</span><span class="chev"><i data-icon="chevron.right" data-size="13" data-weight="2.4"></i></span></div>
    <div class="item center"><span class="t">Workout details</span><span class="chev"><i data-icon="chevron.right" data-size="13" data-weight="2.4"></i></span></div>
  </div>
  <div class="list" style="margin-top:14px">
    <div class="item center"><span class="t" style="color:var(--danger)">Remove from block</span></div>
  </div>
  <div class="list-footer">It leaves every week of the block with the targets the block gave it. It stays in Workouts.</div>
</div>
