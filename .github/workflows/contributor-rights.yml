name: Contributor rights

on:
  # Re-check every open PR. Only trusted main is read; this workflow never
  # checks out or executes a contributor's PR code.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  # A contributor accepts the terms once by commenting the acceptance line.
  issue_comment:
    types: [created, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Exact head SHA you reviewed
        required: true
        type: string
      decision:
        description: Approve or revoke this exact head
        required: true
        type: choice
        options: [approve, revoke]
      confirmation:
        description: I checked that everyone who contributed to this head may grant the contributor-terms rights
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One repository-wide writer serializes status changes. Every surviving run
  # re-checks all open PRs, covering events GitHub replaced in this queue.
  group: contributor-rights
  cancel-in-progress: false

jobs:
  record:
    name: record contributor rights
    if: >-
      github.repository == 'namarks/tres-fort-training'
      && github.ref == 'refs/heads/main'
      && !github.event.repository.private
      && (github.event_name != 'workflow_dispatch'
          || (github.actor == 'namarks' && github.triggering_actor == 'namarks'
              && github.actor_id == '5323089'))
      && (github.event_name != 'issue_comment'
          || (github.event.issue.pull_request
              && contains(github.event.comment.body, 'Contributor')
              && contains(github.event.comment.body, 'Terms')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # For these events GITHUB_SHA identifies trusted main, never PR head.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Set contributor rights status on open PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_DECISION: ${{ inputs.decision }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/contributor-rights.mjs
